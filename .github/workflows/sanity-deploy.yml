name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'sanity.cli.ts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Deploy Sanity Studio
        run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
